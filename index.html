<style>
:root {
  --bg: #faf8f3;
  --bg-soft: #f0ece1;
  --ink: #14140f;
  --ink-soft: #5c5a52;
  --muted: #a8a497;
  --rule: #e2dccd;
  --g-a-bg: #e8f0d4; --g-a-ink: #2d4a1a;
  --g-b-bg: #fdf2cd; --g-b-ink: #6b5410;
  --g-c-bg: #fde1c8; --g-c-ink: #8a3d12;
  --g-f-bg: #f5c9c0; --g-f-ink: #6b1d12;
  --g-na-bg: #ebe7da; --g-na-ink: #8a8676;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Geist', sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
}
.ledger {
  min-height: 100vh;
  padding: 3rem 2rem 0;
  max-width: 1040px;
  margin: 0 auto;
}

/* Status banner for Firebase config */
.status-banner {
  background: var(--g-b-bg);
  color: var(--g-b-ink);
  padding: 0.7rem 1rem;
  border-radius: 6px;
  font-size: 0.82rem;
  margin-bottom: 2rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.status-banner.live { background: var(--g-a-bg); color: var(--g-a-ink); }
.status-banner code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 3px; font-size: 0.9em; }

/* Masthead */
.masthead { margin-bottom: 5rem; padding-top: 2rem; }
.brand {
  font-family: 'Boldonse', serif;
  font-size: 1.1rem;
  letter-spacing: 0.02em;
  margin-bottom: 6rem;
  display: inline-block;
}
.hero {
  font-family: 'Boldonse', serif;
  font-weight: 400;
  font-size: clamp(3rem, 8.5vw, 6.4rem);
  letter-spacing: -0.02em;
  line-height: 0.98;
  margin: 0 0 2rem;
  max-width: 800px;
}
.hero-grade {
  display: inline-block;
  background: var(--g-a-bg);
  color: var(--g-a-ink);
  padding: 0.05em 0.25em;
  border-radius: 0.1em;
  transform: rotate(-2deg);
  margin: 0 0.05em;
  line-height: 0.95;
}
.hero-strike { position: relative; display: inline-block; }
.hero-strike::after {
  content: '';
  position: absolute; left: -2%; right: -2%;
  top: 52%; height: 0.1em;
  background: var(--ink);
  transform: rotate(-3deg);
}
.hero-sub {
  font-size: 1.05rem;
  color: var(--ink-soft);
  margin: 0;
  max-width: 520px;
}

/* Toolbar */
.toolbar { display: flex; flex-direction: column; gap: 1.25rem; margin-bottom: 2rem; }
.search {
  display: flex; align-items: center; gap: 0.6rem;
  border-bottom: 1px solid var(--rule);
  padding: 0.7rem 0;
  color: var(--ink-soft);
  transition: border-color 0.2s ease;
}
.search:focus-within { border-color: var(--ink); }
.search input {
  flex: 1; border: none; background: transparent;
  font-family: inherit; font-size: 1rem; color: var(--ink); outline: none;
}
.search input::placeholder { color: var(--muted); }
.search-icon, .clear { display: flex; align-items: center; }
.clear { background: none; border: none; cursor: pointer; color: var(--muted); padding: 2px; }
.clear:hover { color: var(--ink); }
.hood-row { display: flex; flex-wrap: wrap; gap: 0.25rem; }
.hood {
  font-family: inherit; font-size: 0.85rem;
  background: transparent; border: none; color: var(--muted);
  padding: 0.4rem 0.85rem;
  cursor: pointer; border-radius: 999px;
  transition: all 0.15s ease;
}
.hood:hover { color: var(--ink); background: var(--bg-soft); }
.hood-active { background: var(--ink); color: var(--bg); }

.count-line {
  display: flex; align-items: baseline; gap: 0.75rem;
  margin-bottom: 2rem; padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--rule);
}
.count-num { font-family: 'Boldonse', serif; font-size: 1.4rem; }
.count-word { font-size: 0.9rem; color: var(--muted); flex: 1; }

.add-btn {
  font-family: inherit; font-size: 0.85rem; font-weight: 500;
  background: transparent; border: 1px solid var(--rule); color: var(--ink-soft);
  padding: 0.45rem 0.9rem;
  cursor: pointer; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 0.35rem;
  transition: all 0.15s ease;
}
.add-btn:hover { border-color: var(--ink); color: var(--ink); background: var(--bg-soft); }

/* Unrated state */
.row-grade.g-unrated {
  background: transparent;
  color: var(--muted);
  border: 1px dashed var(--rule);
  font-size: 1.6rem;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 0.05em;
}
.row.unrated .row-blurb { color: var(--muted); }
.unrated-cta {
  font-size: 0.85rem;
  color: var(--ink);
  font-weight: 500;
  margin-top: 0.4rem;
}
.added-by {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 0.5rem;
  font-style: italic;
}

/* Google autocomplete suggestions — override their defaults */
.pac-container {
  font-family: 'Geist', sans-serif !important;
  border-radius: 8px !important;
  border: 1px solid var(--rule) !important;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12) !important;
  margin-top: 4px !important;
  background: var(--bg) !important;
  z-index: 10000 !important;
}
.pac-item {
  padding: 0.6rem 0.8rem !important;
  font-size: 0.9rem !important;
  border-top: 1px solid var(--rule) !important;
  cursor: pointer !important;
}
.pac-item:first-child { border-top: none !important; }
.pac-item:hover { background: var(--bg-soft) !important; }
.pac-icon { display: none !important; }

// SCORING
// ============================================================
function avgScore(ratings) {
  if (!ratings || ratings.length === 0) return null;
  const totals = METRICS.map((m) => {
    const vals = ratings.map((r) => r[m.id]).filter((v) => typeof v === "number");
    if (vals.length === 0) return null;
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  });
  const valid = totals.filter((t) => t !== null);
  if (valid.length === 0) return null;
  const overall = valid.reduce((a, b) => a + b, 0) / valid.length;
  const perMetric = {};
  METRICS.forEach((m, i) => perMetric[m.id] = totals[i]);
  return { overall, perMetric };
}

function scoreToGrade(score) {
  if (score === null || score === undefined) return "—";
  if (score >= 4.6) return "A+";
  if (score >= 4.2) return "A";
  if (score >= 3.8) return "A−";
  if (score >= 3.4) return "B+";
  if (score >= 3.0) return "B";
  if (score >= 2.6) return "B−";
  if (score >= 2.2) return "C";
  if (score >= 1.8) return "D";
  return "F";
}

function gradeClass(grade) {
  if (grade === "—" || grade === "Unrated") return "g-unrated";
  if (grade.startsWith("A")) return "g-a";
  if (grade.startsWith("B")) return "g-b";
  if (grade.startsWith("C")) return "g-c";
  return "g-f";
}

// ============================================================
// STORAGE LAYER — Firebase if configured, localStorage fallback
// ============================================================
const REVIEWS_KEY = "ledger_user_ratings_v1";
const RESTAURANTS_KEY = "ledger_user_restaurants_v1";

const storage = {
  mode: "loading",  // "firebase" | "local" | "loading"
  reviewsCache: {},      // { restaurantId: [rating, ...] }
  restaurantsCache: [],  // [restaurant, ...]
  subscribers: [],

  subscribe(fn) {
    this.subscribers.push(fn);
    return () => { this.subscribers = this.subscribers.filter(s => s !== fn); };
  },

  notify() {
    this.subscribers.forEach(fn => fn({ reviews: this.reviewsCache, restaurants: this.restaurantsCache }));
  },

  async init() {
    if (window.__firebase) {
      this.mode = "firebase";
      const { db, collection, onSnapshot, query, orderBy } = window.__firebase;

      // Reviews stream
      const qReviews = query(collection(db, "reviews"), orderBy("createdAt", "asc"));
      onSnapshot(qReviews, (snapshot) => {
        const next = {};
        snapshot.forEach(doc => {
          const data = doc.data();
          const rid = data.restaurantId;
          if (!next[rid]) next[rid] = [];
          next[rid].push(data);
        });
        this.reviewsCache = next;
        this.notify();
      }, (err) => {
        console.error("Firestore reviews listener error", err);
        this.mode = "local";
        this.loadLocal();
        this.notify();
      });

      // Restaurants stream
      const qRestaurants = query(collection(db, "restaurants"), orderBy("createdAt", "asc"));
      onSnapshot(qRestaurants, (snapshot) => {
        const next = [];
        snapshot.forEach(doc => next.push({ ...doc.data(), id: doc.id }));
        this.restaurantsCache = next;
        this.notify();
      }, (err) => {
        console.error("Firestore restaurants listener error", err);
      });
    } else {
      this.mode = "local";
      this.loadLocal();
      this.notify();
    }
  },

  loadLocal() {
    try {
      const rawReviews = localStorage.getItem(REVIEWS_KEY);
      this.reviewsCache = rawReviews ? JSON.parse(rawReviews) : {};
    } catch (e) {
      this.reviewsCache = {};
    }
    try {
      const rawRestaurants = localStorage.getItem(RESTAURANTS_KEY);
      this.restaurantsCache = rawRestaurants ? JSON.parse(rawRestaurants) : [];
    } catch (e) {
      this.restaurantsCache = [];
    }
  },

  async addReview(restaurantId, rating) {
    if (this.mode === "firebase") {
      const { db, collection, addDoc, serverTimestamp } = window.__firebase;
      try {
        await addDoc(collection(db, "reviews"), {
          restaurantId,
          ...rating,
          createdAt: serverTimestamp(),
        });
      } catch (e) {
        console.error("Firestore write failed", e);
        throw e;
      }
    } else {
      if (!this.reviewsCache[restaurantId]) this.reviewsCache[restaurantId] = [];
      this.reviewsCache[restaurantId].push(rating);
      try {
        localStorage.setItem(REVIEWS_KEY, JSON.stringify(this.reviewsCache));
      } catch (e) {
        console.error("localStorage write failed", e);
      }
      this.notify();
    }
  },

  async addRestaurant(restaurant) {
    if (this.mode === "firebase") {
      const { db, collection, addDoc, serverTimestamp } = window.__firebase;
      try {
        const docRef = await addDoc(collection(db, "restaurants"), {
          ...restaurant,
          createdAt: serverTimestamp(),
        });
        return docRef.id;
      } catch (e) {
        console.error("Firestore write failed", e);
        throw e;
      }
    } else {
      const id = "u_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      this.restaurantsCache.push({ ...restaurant, id });
      try {
        localStorage.setItem(RESTAURANTS_KEY, JSON.stringify(this.restaurantsCache));
      } catch (e) {
        console.error("localStorage write failed", e);
      }
      this.notify();
      return id;
    }
  },
};

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

// ============================================================
// RENDER
// ============================================================
function getMerged() {
  const seedMerged = SEED.map(r => ({
    ...r,
    ratings: [...r.ratings, ...(state.userRatings[r.id] || [])],
  }));
  const userAdded = (state.userRestaurants || []).map(r => ({
    ...r,
    ratings: state.userRatings[r.id] || [],
    isUserAdded: true,
  }));
  return [...seedMerged, ...userAdded];
}

function getFiltered() {
  return getMerged()
    .filter(r => state.neighborhood === "All" ? true : r.neighborhood === state.neighborhood)
    .filter(r => state.query.trim() === "" ? true :
      (r.name + r.cuisine + r.neighborhood).toLowerCase().includes(state.query.toLowerCase()))
    .map(r => ({ ...r, score: avgScore(r.ratings) }))
    .sort((a, b) => {
      // Unrated go to the bottom
      const aScore = a.score?.overall ?? -Infinity;
      const bScore = b.score?.overall ?? -Infinity;
      return bScore - aScore;
    });
}

function renderSpark(perMetric, grade) {
  if (!perMetric) return "";
  return `<div class="spark ${gradeClass(grade)}">` +
    METRICS.map(m => {
      const v = perMetric[m.id];
      const pct = v ? (v / 5) * 100 : 8;
      return `<div class="spark-bar" title="${escapeHtml(m.label)}: ${v ? v.toFixed(1) : "—"}"><div class="spark-fill" style="height: ${pct}%"></div></div>`;
    }).join("") + "</div>";
}

function renderRow(r, i) {
  const count = r.ratings.length;
  const isUnrated = count === 0;
  const grade = isUnrated ? "—" : scoreToGrade(r.score?.overall);
  const blurb = r.blurb || (r.address ? r.address : "");
  return `<article class="row ${isUnrated ? "unrated" : ""}" data-restaurant="${r.id}" style="animation-delay: ${i * 35}ms">
    <div class="row-grade ${gradeClass(grade)}">${grade}</div>
    <div class="row-body">
      <h2 class="row-name">${escapeHtml(r.name)}</h2>
      <p class="row-meta">${escapeHtml(r.cuisine || "Restaurant")} · ${escapeHtml(r.neighborhood)}</p>
      ${isUnrated
        ? `<p class="unrated-cta">Be the first to rate this restaurant →</p>
           ${r.addedBy ? `<p class="added-by">Added by @${escapeHtml(r.addedBy)}</p>` : ""}`
        : `<p class="row-blurb">${escapeHtml(blurb)}</p>`}
    </div>
    <div class="row-spark">
      ${isUnrated ? "" : renderSpark(r.score?.perMetric, grade)}
      <span class="row-count">${isUnrated ? "Unrated" : `${count} ${count === 1 ? "review" : "reviews"}`}</span>
    </div>
    <button class="row-arrow" aria-label="Open">${Icons.arrow()}</button>
  </article>`;
}

  if (storage.mode === "firebase") {

// Avoid full re-render on every keystroke
function renderListOnly() {
  const filtered = getFiltered();
  const list = document.querySelector(".list");
  const countNum = document.querySelector(".count-num");

  if (countNum) countNum.textContent = String(filtered.length).padStart(2, "0");

  if (!list) return;
  list.innerHTML = filtered.length === 0
    ? `<div class="empty">Nothing matches.</div>`
    : filtered.map(renderRow).join("");
  document.querySelectorAll(".row").forEach(row => {

      openDetail(r);
    });

function inferNeighborhood(addressComponents) {
  if (!addressComponents) return "";
  // Try to pick a neighborhood from Google's address components
  const knownHoods = NEIGHBORHOODS.slice(1).map(h => h.toLowerCase());
  for (const c of addressComponents) {
    const longName = (c.long_name || "").toLowerCase();
    const match = knownHoods.find(h => longName.includes(h) || h.includes(longName));
    if (match) {
      return NEIGHBORHOODS.find(n => n.toLowerCase() === match);
    }
    if (c.types && c.types.some(t => ["neighborhood", "sublocality", "locality"].includes(t))) {
      // Capitalize-case
      const formatted = c.long_name;
      const knownMatch = NEIGHBORHOODS.find(n => n.toLowerCase() === formatted.toLowerCase());
      if (knownMatch) return knownMatch;
    }
  }
  return "";
}

function openAddRestaurant() {
  let picked = null;     // { name, address, lat, lng, placeId, neighborhood }
  let manualName = "";
  let manualNeighborhood = NEIGHBORHOODS[1];
  let manualCuisine = "";
  let submitting = false;

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";

  function html() {
    const googleReady = window.__google && window.__google.ready;
    return `
      <div class="modal" onclick="event.stopPropagation()">

        ${picked ? `

        ` : `
          <div class="field">
            <input id="manual-name" type="text" placeholder="Restaurant name" value="${escapeHtml(manualName)}" />
          </div>
          <div class="field">
            <input id="manual-cuisine" type="text" placeholder="Cuisine (e.g. Italian, Cafe)" value="${escapeHtml(manualCuisine)}" />
          </div>
          <div class="field">
            <select id="manual-hood" style="width: 100%; font-family: inherit; font-size: 0.95rem; padding: 0.8rem 0; border: none; border-bottom: 1px solid var(--rule); background: transparent; color: var(--ink); outline: none;">
              ${NEIGHBORHOODS.slice(1).map(n => `<option value="${escapeHtml(n)}" ${n === manualNeighborhood ? "selected" : ""}>${escapeHtml(n)}</option>`).join("")}
            </select>
          </div>
        `}

        ${picked ? `
          <div class="field">
            <select id="picked-hood" style="width: 100%; font-family: inherit; font-size: 0.95rem; padding: 0.8rem 0; border: none; border-bottom: 1px solid var(--rule); background: transparent; color: var(--ink); outline: none;">
              ${NEIGHBORHOODS.slice(1).map(n => `<option value="${escapeHtml(n)}" ${n === picked.neighborhood ? "selected" : ""}>${escapeHtml(n)}</option>`).join("")}
            </select>
            <p class="add-form-note">Confirm or adjust the neighborhood.</p>
          </div>
          <div class="field">
            <input id="picked-cuisine" type="text" placeholder="Cuisine (e.g. Italian, Cafe)" value="${escapeHtml(picked.cuisine || "")}" />
          </div>
        ` : ""}

        <div class="rate-foot">
          <button class="btn-ghost" data-action="close">Cancel</button>
          <button class="btn-primary" data-action="submit" ${submitting ? "disabled" : ""}>${submitting ? "Adding..." : "Add to ledger"}</button>
        </div>
      </div>
    `;
  }

  function rerender() {
    overlay.innerHTML = html();
    wire();
  }

  function wire() {
    overlay.querySelectorAll('[data-action="close"]').forEach(b => b.addEventListener("click", closeModal));
    const clearBtn = overlay.querySelector('[data-action="clear-pick"]');
    if (clearBtn) clearBtn.addEventListener("click", () => { picked = null; rerender(); });

    // Wire Google Places Autocomplete on the input, if available
    const placesInput = overlay.querySelector("#places-input");
    if (placesInput && window.__google && window.__google.ready && window.google?.maps?.places) {
      try {
        // Bias to Bay Area
        const bayAreaBounds = new google.maps.LatLngBounds(
          new google.maps.LatLng(37.0, -122.6),
          new google.maps.LatLng(38.2, -121.7)
        );
        const ac = new google.maps.places.Autocomplete(placesInput, {
          bounds: bayAreaBounds,
          strictBounds: false,
          types: ["restaurant", "cafe", "bakery", "bar", "food"],
          fields: ["name", "formatted_address", "geometry", "place_id", "address_components", "types"],
        });
        ac.addListener("place_changed", () => {
          const place = ac.getPlace();
          if (!place || !place.geometry) return;
          // Crude cuisine guess from types
          const cuisineMap = {
            bakery: "Bakery", cafe: "Cafe", bar: "Bar",
            meal_takeaway: "Takeout", meal_delivery: "Delivery",
          };
          let cuisine = "";
          for (const t of (place.types || [])) {
            if (cuisineMap[t]) { cuisine = cuisineMap[t]; break; }
          }
          picked = {
            name: place.name,
            address: place.formatted_address,
            lat: place.geometry.location.lat(),
            lng: place.geometry.location.lng(),
            placeId: place.place_id,
            neighborhood: inferNeighborhood(place.address_components) || NEIGHBORHOODS[1],

          rerender();
        });

        setTimeout(() => {
          document.querySelectorAll(".pac-container").forEach(el => { el.style.zIndex = "10000"; });

        restaurant = {
          name: picked.name,
          address: picked.address,
          neighborhood: hoodEl ? hoodEl.value : picked.neighborhood,
          cuisine: cuisineEl ? cuisineEl.value.trim() || "Restaurant" : "Restaurant",
          lat: picked.lat,
          lng: picked.lng,
          placeId: picked.placeId,
          source: "google_places",
          blurb: "",
        };
      } else {
        const nameEl = overlay.querySelector("#manual-name");
        const cuisineEl = overlay.querySelector("#manual-cuisine");
        const hoodEl = overlay.querySelector("#manual-hood");
        if (!nameEl || !nameEl.value.trim()) {
          alert("Please enter a restaurant name.");
          return;
        }
        restaurant = {
          name: nameEl.value.trim(),
          cuisine: (cuisineEl?.value || "").trim() || "Restaurant",
          neighborhood: hoodEl?.value || NEIGHBORHOODS[1],
          address: "",
          source: "manual",
          blurb: "",
        };
      }

      submitting = true;
      rerender();
      try {
        await storage.addRestaurant(restaurant);
        closeModal();
      } catch (e) {
        submitting = false;
        alert("Could not add the restaurant. Please try again.");
        rerender();
      }
    });
  }

  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  rerender();
  document.body.appendChild(overlay);
}

// ============================================================
// RATE MODAL
// ============================================================
function openRate(restaurant) {
  const values = Object.fromEntries(METRICS.map(m => [m.id, 3]));
  let note = "";
  let user = "";
  let submitting = false;

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  function html() {
    return `
    <div class="modal" onclick="event.stopPropagation()">
      <button class="modal-close" data-action="close">${Icons.x(18)}</button>
      <h2 class="detail-name" style="margin-bottom: 0">Review ${escapeHtml(restaurant.name)}</h2>
      <p class="detail-meta" style="margin-bottom: 2rem">1 is poor, 5 is exemplary.</p>
      <div class="rate-grid">
        ${METRICS.map(m => `
          <div class="rate-row">
            <div class="rate-label">
              <span>${escapeHtml(m.label)}</span>
              <span class="metric-row-help">${escapeHtml(m.help)}</span>
            </div>
            <div class="rate-buttons" data-metric="${m.id}">
              ${[1,2,3,4,5].map(n => `<button class="rate-btn ${values[m.id] === n ? "rate-btn-active" : ""}" data-value="${n}">${n}</button>`).join("")}
            </div>
          </div>`).join("")}
      </div>
      <div class="field">
        <input id="rate-user" type="text" placeholder="Your handle (optional)" value="${escapeHtml(user)}" />
      </div>
      <div class="field">
        <textarea id="rate-note" rows="3" placeholder="What did you actually observe?">${escapeHtml(note)}</textarea>
      </div>
      <div class="rate-foot">
        <button class="btn-ghost" data-action="close">Cancel</button>
        <button class="btn-primary" data-action="submit" ${submitting ? "disabled" : ""}>${submitting ? "Filing..." : "File review"}</button>
      </div>
    </div>`;
  }
  function rerender() { overlay.innerHTML = html(); wire(); }
  function wire() {
    overlay.querySelectorAll('[data-action="close"]').forEach(b => b.addEventListener("click", closeModal));
    overlay.querySelectorAll(".rate-buttons").forEach(group => {
      const metricId = group.dataset.metric;
      group.querySelectorAll(".rate-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          values[metricId] = parseInt(btn.dataset.value, 10);
          rerender();
        });
      });
    });
    const userInput = overlay.querySelector("#rate-user");
    const noteInput = overlay.querySelector("#rate-note");
    if (userInput) userInput.addEventListener("input", e => { user = e.target.value; });
    if (noteInput) noteInput.addEventListener("input", e => { note = e.target.value; });

    overlay.querySelector('[data-action="submit"]').addEventListener("click", async () => {
      if (submitting) return;
      submitting = true;
      rerender();
      try {
        await storage.addReview(restaurant.id, {
          ...values,
          note: note.trim(),
          user: user.trim() || "anonymous",
          date: new Date().toISOString().slice(0, 10),
        });
        closeModal();
      } catch (e) {
        submitting = false;
        alert("Could not save your review. Please try again.");
        rerender();
      }
    });
  }
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  rerender();
  document.body.appendChild(overlay);
}

// ============================================================
// BOOT
// ============================================================
function boot() {
  storage.init();
  render();
}

// Re-render when Google Maps finishes loading (so any open modal can use it)
window.addEventListener("google-ready", () => {
  // No-op for the main render; openAddRestaurant reads window.__google.ready each time
});

// Wait briefly for firebase init script to run (it's a module, slightly async)
if (window.__firebase !== undefined) {
  boot();
} else {
  window.addEventListener("firebase-ready", boot, { once: true });
  // Fallback in case the firebase-ready event never fires
  setTimeout(() => { if (storage.mode === "loading") boot(); }, 500);
}
</script>
</body>
</html>
